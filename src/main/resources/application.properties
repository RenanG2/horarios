spring.application.name=horarios-api

# Banco H2 em arquivo (os dados persistem entre execuções, na pasta ./data)
spring.datasource.url=jdbc:h2:file:./data/horarios
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Credenciais da autenticação básica (troque em produção!)
app.security.username=admin
app.security.password=admin123

# Carrega dados de exemplo se o banco estiver vazio
app.seed.enabled=true
